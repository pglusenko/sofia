<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Софії | Закритий доступ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="auth-screen" class="android-auth-container">
        <div class="auth-card">
            <h2>Вхід для Софії</h2>
            <p>Намалюй графічний ключ, щоб увійти</p>
            
            <div class="pattern-wrapper">
                <canvas id="pattern-canvas"></canvas>
                <div class="pattern-grid" id="pattern-grid">
                    <div class="pattern-node" data-index="1"><div class="dot"></div></div>
                    <div class="pattern-node" data-index="2"><div class="dot"></div></div>
                    <div class="pattern-node" data-index="3"><div class="dot"></div></div>
                    <div class="pattern-node" data-index="4"><div class="dot"></div></div>
                    <div class="pattern-node" data-index="5"><div class="dot"></div></div>
                    <div class="pattern-node" data-index="6"><div class="dot"></div></div>
                    <div class="pattern-node" data-index="7"><div class="dot"></div></div>
                    <div class="pattern-node" data-index="8"><div class="dot"></div></div>
                    <div class="pattern-node" data-index="9"><div class="dot"></div></div>
                </div>
            </div>
            
            <p id="error-message" class="error-text hidden">Ключ не збігся. Спробуй ще раз, сонечко 😘</p>
        </div>
    </div>

    <div id="main-content" class="hidden">
        <section class="hero-section">
            <div class="glass-card">
                <h1>Ми знайомі:</h1>
                <div class="counter-container">
                    <div class="counter-box"><span id="days">00</span><label>днів</label></div>
                    <div class="counter-box"><span id="hours">00</span><label>годин</label></div>
                    <div class="counter-box"><span id="minutes">00</span><label>хвилин</label></div>
                    <div class="counter-box"><span id="seconds">00</span><label>секунд</label></div>
                </div>
            </div>
        </section>

        <section class="timeline-section">
            <div class="timeline">
                <div class="timeline-item"><div class="image-box"><img id="photo-1" src="" alt="Спогад 1"></div></div>
                <div class="timeline-item"><div class="image-box"><img id="photo-2" src="" alt="Спогад 2"></div></div>
                <div class="timeline-item"><div class="image-box"><img id="photo-3" src="" alt="Спогад 3"></div></div>
                <div class="timeline-item"><div class="image-box"><img id="photo-4" src="" alt="Спогад 4"></div></div>
                <div class="timeline-item"><div class="image-box"><img id="photo-5" src="" alt="Спогад 5"></div></div>
                <div class="timeline-item"><div class="image-box"><img id="photo-6" src="" alt="Спогад 6"></div></div>
                <div class="timeline-item"><div class="image-box"><img id="photo-7" src="" alt="Спогад 7"></div></div>
                <div class="timeline-item"><div class="image-box"><img id="photo-8" src="" alt="Спогад 8"></div></div>
            </div>
        </section>
        
        <section class="interactive-section">
            <div class="glass-card" id="final-card">
                <div class="final-image-wrapper"><img id="photo-final" src="" class="final-photo"></div>
                <h2>Це взаємно! ❤️</h2>
                <div id="quiz-card">
                    <button id="final-yes">Так</button>
                    <button id="final-no">Ні</button>
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
